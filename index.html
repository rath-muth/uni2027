<title>Medicine 2027</title>
<style>
  :root{color-scheme:light;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
    --ring:rgba(11,11,11,.10);--accent:#2a78d6;--bad:#d03b3b}
  @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;
    --ink2:#c3c2b7;--muted:#898781;--ring:rgba(255,255,255,.10);--accent:#3987e5;--bad:#e66767}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .box{background:var(--card);border:1px solid var(--ring);border-radius:16px;padding:26px 24px;
    width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  p{margin:0 0 18px;font-size:13.5px;color:var(--ink2);line-height:1.5}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid var(--ring);
    background:var(--bg);color:var(--ink);font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:600;border:none;border-radius:10px;
    background:var(--accent);color:#fff;font-family:inherit;cursor:pointer}
  button[disabled]{opacity:.6;cursor:progress}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5}
</style>
